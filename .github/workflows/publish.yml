name: Publish to JSR

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # required for JSR OIDC auth

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify version match
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          JSR_VERSION=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')
          if [ "$TAG_VERSION" != "$JSR_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) doesn't match jsr.json version ($JSR_VERSION)"
            exit 1
          fi
          echo "Version match: $TAG_VERSION"

      - name: Lint
        run: deno lint
        continue-on-error: true   # v0.1: lint warning acceptable

      - name: Format check
        run: deno fmt --check
        continue-on-error: true

      - name: Publish to JSR
        run: deno publish --allow-slow-types
        # NOTE v0.1.0: --allow-slow-types bypassa requirement explicit types.
        # Fix in v0.2.0 → rimuovere flag.
